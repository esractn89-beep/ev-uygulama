# XcodeGen proje tanımı. macOS'ta: `brew install xcodegen && xcodegen generate`
name: EvdeAdalet
options:
  bundleIdPrefix: com.example.evdeadalet
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
packages:
  EvdeAdaletCore:
    path: .
targets:
  EvdeAdalet:
    type: application
    platform: iOS
    sources:
      - path: EvdeAdalet
    dependencies:
      - package: EvdeAdaletCore
    info:
      path: Destek/Info.plist
      properties:
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Destek/EvdeAdalet.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.example.evdeadalet]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.evdeadalet
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Evde Adalet"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  EvdeAdalet:
    build:
      targets:
        EvdeAdalet: all
    test:
      targets:
        - package: EvdeAdaletCore/EvdeAdaletCoreTests
